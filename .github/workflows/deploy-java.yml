name: Build and deploy CullPilot

permissions:
  contents: read

concurrency:
  group: cullpilot-production
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test Java
        working-directory: CullPilot/backend-java
        run: mvn -B test package

      - name: Upload tested Java artifact
        uses: actions/upload-artifact@v4
        with:
          name: cullpilot-java-jar
          path: CullPilot/backend-java/target/cullpilot-backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Test Python API and algorithms
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r CullPilot/python-api/requirements.txt
          python -m pytest -q CullPilot/python-api/tests demo/tests/test_pose_grouping.py

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tested Java artifact
        uses: actions/download-artifact@v4
        with:
          name: cullpilot-java-jar
          path: ${{ runner.temp }}/cullpilot-java-artifact

      - name: Prepare deployment archive
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find "$RUNNER_TEMP/cullpilot-java-artifact" -type f -name '*.jar' -print -quit)"
          test -n "$jar"
          mkdir -p CullPilot/backend-java/target
          cp "$jar" CullPilot/backend-java/target/cullpilot-backend-0.0.1-SNAPSHOT.jar
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="$RUNNER_TEMP/cullpilot-${release_id}.tar.gz"
          tar -czf "$archive" \
            CullPilot/backend-java/target/cullpilot-backend-0.0.1-SNAPSHOT.jar \
            CullPilot/python-api/app \
            CullPilot/python-api/requirements.txt \
            CullPilot/python-api/requirements-ai.txt \
            CullPilot/deploy \
            demo/agent
          echo "CULLPILOT_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "CULLPILOT_RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Prepare SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          sed -i 's/\r$//' "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if ! ssh-keygen -y -f "$HOME/.ssh/deploy_key" </dev/null >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY must contain the complete, unencrypted private key (not the .pub file)." >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Verify SSH login
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentityAgent=none -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -i "$HOME/.ssh/deploy_key" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            'test "$(id -u)" -eq 0 && test -d /root/workspace/aic'

      - name: Upload release archive
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          archive_name="cullpilot-${CULLPILOT_RELEASE_ID}.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentityAgent=none -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -i "$HOME/.ssh/deploy_key" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            'install -d -m 0700 /root/workspace/aic/incoming'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentityAgent=none -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -i "$HOME/.ssh/deploy_key" -P "$port" \
            "$CULLPILOT_ARCHIVE" \
            "$DEPLOY_USER@$DEPLOY_HOST:/root/workspace/aic/incoming/$archive_name"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentityAgent=none -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -i "$HOME/.ssh/deploy_key" -P "$port" \
            CullPilot/deploy/update-server.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/root/workspace/aic/incoming/update-server-${CULLPILOT_RELEASE_ID}.sh"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentityAgent=none -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -i "$HOME/.ssh/deploy_key" -P "$port" \
            CullPilot/deploy/run-server.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/root/workspace/aic/incoming/run-server-${CULLPILOT_RELEASE_ID}.sh"

      - name: Start server deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          archive_name="cullpilot-${CULLPILOT_RELEASE_ID}.tar.gz"
          unit="cullpilot-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o IdentityAgent=none -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -i "$HOME/.ssh/deploy_key" -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "systemd-run --unit='$unit' --service-type=exec --setenv='CULLPILOT_RELEASE_ID=$CULLPILOT_RELEASE_ID' --setenv='CULLPILOT_RELEASE_ARCHIVE=/root/workspace/aic/incoming/$archive_name' /bin/bash '/root/workspace/aic/incoming/run-server-$CULLPILOT_RELEASE_ID.sh'"

      - name: Watch server deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          status_file="/root/workspace/aic/runtime/deploy-status/${CULLPILOT_RELEASE_ID}.status"
          log_file="/root/workspace/aic/runtime/deploy-logs/${CULLPILOT_RELEASE_ID}.log"
          unit="cullpilot-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentityAgent=none -o IdentitiesOnly=yes -o PasswordAuthentication=no)
          for attempt in {1..360}; do
            if ! status="$(ssh "${ssh_opts[@]}" -i "$HOME/.ssh/deploy_key" -p "$port" \
                "$DEPLOY_USER@$DEPLOY_HOST" \
                "if test -f '$status_file'; then cat '$status_file'; elif systemctl is-failed --quiet '$unit'; then printf failed-unit; else printf pending; fi")"; then
              echo "Status connection failed; retrying in 20 seconds. Server deployment continues independently."
            elif [[ "$status" == "0" ]]; then
              ssh "${ssh_opts[@]}" -i "$HOME/.ssh/deploy_key" -p "$port" \
                "$DEPLOY_USER@$DEPLOY_HOST" "tail -n 80 '$log_file'" || true
              echo "Server deployment completed successfully."
              exit 0
            elif [[ "$status" != "pending" ]]; then
              ssh "${ssh_opts[@]}" -i "$HOME/.ssh/deploy_key" -p "$port" \
                "$DEPLOY_USER@$DEPLOY_HOST" "tail -n 100 '$log_file'; journalctl -u '$unit' -n 30 --no-pager" || true
              echo "Server deployment failed with exit code: $status" >&2
              exit 1
            elif (( attempt % 3 == 0 )); then
              echo "Server deployment still running (check $attempt of 360)."
              ssh "${ssh_opts[@]}" -i "$HOME/.ssh/deploy_key" -p "$port" \
                "$DEPLOY_USER@$DEPLOY_HOST" "tail -n 3 '$log_file'" || true
            fi
            sleep 20
          done
          echo "Timed out waiting for server deployment; check $status_file and $log_file before retrying." >&2
          exit 1
