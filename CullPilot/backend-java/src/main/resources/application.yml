spring:
  application:
    name: cullpilot-backend
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:../data/cullpilot.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 400MB

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

python-api:
  base-url: ${PYTHON_API_BASE_URL:http://localhost:8001}
  timeout: ${PYTHON_API_TIMEOUT_SECONDS:600}s

storage:
  root: ${STORAGE_ROOT:../storage}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  auth:
    access-token-ttl: ${ACCESS_TOKEN_TTL:24h}
